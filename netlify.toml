# Netlify configuration — jamiecarlson.fyi
# Static site: no build step, the repo root is published as-is.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Friendly URL for the résumé.
# Right now this forwards to the Google Drive copy. Once you drop a PDF into
# resume/ (see README), change the `to` below to "/resume/Jamie-Carlson-Resume.pdf"
# and set status = 200 so it serves from your own domain.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/side-projects"
  to = "/side-projects.html"
  status = 200

[[redirects]]
  from = "/resume"
  to = "/resume/Jamie-Carlson-Resume.pdf"
  status = 200
  force = true

[[redirects]]
  from = "/portfolio"
  to = "/resume/Jamie-Carlson-Product-Portfolio.pdf"
  status = 200
  force = true

# Force the bare apex as canonical (www -> apex)
[[redirects]]
  from = "https://www.jamiecarlson.fyi/*"
  to = "https://jamiecarlson.fyi/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ---------------------------------------------------------------------------
# Caching: hash-free filenames, so HTML must revalidate but media can sit.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/resume/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------------
# CMS + content
# ---------------------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=0, must-revalidate"

# Content must never be stale, or edits appear not to have saved.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
